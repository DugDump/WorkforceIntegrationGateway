name: workforce-gateway

services:
  database:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: ${WIG_POSTGRES_DB:?Set WIG_POSTGRES_DB in .env}
      POSTGRES_USER: ${WIG_POSTGRES_USER:?Set WIG_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${WIG_POSTGRES_PASSWORD:?Set WIG_POSTGRES_PASSWORD in .env}
    ports:
      - "${WIG_POSTGRES_PORT:?Set WIG_POSTGRES_PORT in .env}:5432"
    volumes:
      - workforce-gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  workforce-gateway-postgres:
